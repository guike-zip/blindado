name: Blindado
options:
  bundleIdPrefix: io.blindado
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: pt-BR
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: false
    # Fonte única de verdade da versão do app — fastlane (increment_version_number /
    # increment_build_number) edita estes dois valores aqui e roda `xcodegen generate` de
    # novo, em vez de mexer direto no .xcodeproj (que seria sobrescrito na próxima geração).
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "5"
    # pt-BR é o idioma de origem do catálogo (Localizable.xcstrings); inglês é a segunda
    # localização suportada (pedido do usuário — i18n en/pt-BR).
    DEVELOPMENT_LANGUAGE: pt-BR
    # DEVELOPMENT_TEAM fica só em Local.xcconfig (gitignorado — repo público) via `configFiles`
    # abaixo, não aqui. CODE_SIGN_STYLE (Automatic) também vem de lá para os builds de Debug;
    # os targets de app iOS/macOS sobrescrevem para Manual só na config Release — ver o
    # comentário no target `Blindado` abaixo (research.md #13).
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

targets:
  Blindado:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Blindado
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.blindado.app
        PRODUCT_NAME: Blindado
        TARGETED_DEVICE_FAMILY: "1" # só iPhone (spec.md — iPad fora de escopo)
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # AppIcon.appiconset — conceito 01 "Sólido" (design/blindado-app-icon.html), renderizado
        # em Blindado/Theme/Assets.xcassets/AppIcon.appiconset/ (research.md #12).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          # Assinatura manual só no Release (App Store): Automatic força um perfil de
          # Development no passo de archive (exige um device registrado, que não existe nesta
          # conta) e, ao ser contornado limpando CODE_SIGN_IDENTITY, produz um .xcarchive sem
          # assinatura real — o export subsequente regenera entitlements mínimos do zero,
          # derrubando dns-settings/app-groups (achado em teste real de TestFlight, build 3:
          # "permission denied"). Perfil gerado via `fastlane sigh` (README-SETUP.md).
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "io.blindado.app AppStore"
    info:
      path: Blindado/Info.plist
      properties:
        CFBundleDisplayName: Blindado
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [pt-BR, en]
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Blindado/Blindado.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.blindado.app
        com.apple.developer.networking.networkextension:
          - dns-settings
    dependencies:
      - target: BlindadoContentBlocker
        embed: true

  BlindadoContentBlocker:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: BlindadoContentBlocker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.blindado.app.contentblocker
        PRODUCT_NAME: BlindadoContentBlocker
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "io.blindado.app.contentblocker AppStore"
    info:
      path: BlindadoContentBlocker/Info.plist
      properties:
        CFBundleDisplayName: BlindadoContentBlocker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.content-blocker
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentBlockerRequestHandler
    entitlements:
      path: BlindadoContentBlocker/BlindadoContentBlocker.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.blindado.app

  BlindadoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: BlindadoTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.blindado.app.tests
    dependencies:
      - target: Blindado

  # --- macOS: mesmo código-fonte de Blindado/, BlindadoContentBlocker/ e BlindadoTests/,
  # com navegação por sidebar (RootSidebarView) em vez da tab bar do iOS (research.md #11) ---

  BlindadoMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Blindado
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.blindado.app
        # PRODUCT_NAME fica como o nome do target (BlindadoMac) de propósito — sobrescrever
        # para "Blindado" (igual ao alvo iOS) quebra o TEST_HOST que o xcodegen gera para
        # BlindadoMacTests, que assume PRODUCT_NAME == nome do target. O nome visível pelo
        # usuário continua "Blindado" via CFBundleDisplayName no Info.plist. PRODUCT_MODULE_NAME
        # é independente do PRODUCT_NAME — fixado em "Blindado" para que
        # `@testable import Blindado` funcione com o mesmo arquivo de teste nos dois targets.
        PRODUCT_MODULE_NAME: Blindado
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon # mesmo AppIcon.appiconset do alvo iOS (entradas idiom "mac")
        COMBINE_HIDPI_IMAGES: true
        ENABLE_HARDENED_RUNTIME: true
      configs:
        Release:
          # Mesmo problema e mesma correção do alvo iOS `Blindado` (ver comentário lá) —
          # Automatic também quebra a assinatura de verdade no archive do macOS.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "io.blindado.app macOS AppStore"
    info:
      path: BlindadoMac/Info.plist
      properties:
        CFBundleDisplayName: Blindado
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [pt-BR, en]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: BlindadoMac/BlindadoMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - group.io.blindado.app
        com.apple.developer.networking.networkextension:
          - dns-settings
    dependencies:
      - target: BlindadoMacContentBlocker
        embed: true

  BlindadoMacContentBlocker:
    type: app-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: BlindadoContentBlocker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.blindado.app.contentblocker
        PRODUCT_NAME: BlindadoContentBlocker
        ENABLE_HARDENED_RUNTIME: true
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "io.blindado.app.contentblocker macOS AppStore"
    info:
      path: BlindadoMac/ContentBlockerInfo.plist
      properties:
        CFBundleDisplayName: BlindadoContentBlocker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.content-blocker
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentBlockerRequestHandler
    entitlements:
      path: BlindadoMac/BlindadoMacContentBlocker.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.io.blindado.app

  BlindadoMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: BlindadoTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.blindado.app.tests
    dependencies:
      - target: BlindadoMac

schemes:
  Blindado:
    build:
      targets:
        Blindado: all
        BlindadoTests: [test]
    test:
      targets:
        - BlindadoTests

  BlindadoMac:
    build:
      targets:
        BlindadoMac: all
        BlindadoMacTests: [test]
    test:
      targets:
        - BlindadoMacTests
